name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'samples/Vibe.UI.Docs/**'
      - 'src/Vibe.UI.CSS/**'
      - 'src/Vibe.UI/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one that has started.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs on purpose. In one job the deploy step asked for the artifact 0.7 seconds after the
# upload and was told there was none, and re-running that job uploaded a second artifact of the
# same name, which the deploy step refuses. With the upload in its own job, the artifact is
# complete before deploy starts, and re-running a failed deploy uploads nothing.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore samples/Vibe.UI.Docs/Vibe.UI.Docs.csproj

      - name: Build
        run: dotnet build samples/Vibe.UI.Docs/Vibe.UI.Docs.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish samples/Vibe.UI.Docs/Vibe.UI.Docs.csproj -c Release -o release --nologo

      - name: Add scoped CSS shim for static hosting
        run: |
          set -euo pipefail
          bundle_dir="release/wwwroot/_content/Vibe.UI"
          bundle_file="$(ls "${bundle_dir}/Vibe.UI."*.bundle.scp.css | head -n 1)"
          cp "${bundle_file}" "${bundle_dir}/Vibe.UI.bundle.scp.css"
          if [ -f "${bundle_file}.gz" ]; then
            cp "${bundle_file}.gz" "${bundle_dir}/Vibe.UI.bundle.scp.css.gz"
          fi
          if [ -f "${bundle_file}.br" ]; then
            cp "${bundle_file}.br" "${bundle_dir}/Vibe.UI.bundle.scp.css.br"
          fi

      - name: Change base-tag in index.html
        run: |
          set -euo pipefail
          sed -i 's/<base href="\/" \/>/<base href="\/Vibe.UI\/" \/>/g' release/wwwroot/index.html
          # sed exits 0 when nothing matched, and the site would then load nothing under /Vibe.UI/.
          grep -q '<base href="/Vibe.UI/" />' release/wwwroot/index.html

      - name: Add .nojekyll file
        run: touch release/wwwroot/.nojekyll

      - name: Copy 404.html for SPA routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'release/wwwroot'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
